OCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerbyte | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
   (function(){
      emailjs.init("3jw8MSkxGJlrvtd_O"); // Replace with your key
   })();
</script>
</head>
<body class="bg-[#0b0e11] text-white font-sans min-h-screen">

    <nav class="flex items-center justify-between px-6 py-4 border-b border-gray-800 bg-[#0b0e11] sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="bg-[#00d084] p-1.5 rounded-lg text-black font-bold text-xl">Z</div>
            <span class="text-xl font-bold">Zerbyte</span>
        </div>
        <div class="flex items-center gap-4">
            <div id="user-email" class="text-xs text-gray-400 hidden lg:block">Loading...</div>
            <button id="logout-btn" class="text-gray-400 hover:text-red-400 transition text-lg">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-[#161a1e] border border-gray-800 rounded-3xl p-6">
                <p class="text-gray-500 text-sm">Total Balance</p>
                <h2 id="total-balance" class="text-4xl font-bold mt-1 tabular-nums text-white">$0.00</h2>
                <div class="mt-4 flex gap-2">
                    <span id="verification-status" class="text-xs font-bold px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-500 border border-yellow-500/20">Unverified</span>
                </div>
            </div>

            <div class="bg-[#161a1e] border border-gray-800 rounded-3xl p-6">
                <h3 class="font-bold mb-4">Quick Actions</h3>
                <div class="grid grid-cols-3 gap-3">
                    <button onclick="openModal('deposit-modal')" class="bg-[#1e2329] p-4 rounded-2xl flex flex-col items-center gap-2">
                        <i class="fa-solid fa-plus text-[#00d084]"></i>
                        <span class="text-[10px] font-bold">Deposit</span>
                    </button>
                    <button id="withdraw-nav-btn" onclick="window.location.href='withdraw.html'" class="bg-[#1e2329] p-4 rounded-2xl flex flex-col items-center gap-2">
                        <i class="fa-solid fa-wallet text-orange-400"></i>
                        <span class="text-[10px] font-bold">Withdraw</span>
                    </button>
                    <button id="trade-nav-btn" onclick="window.location.href='swap.html'" class="hidden bg-[#1e2329] p-4 rounded-2xl flex flex-col items-center gap-2 border border-[#00d084]/30">
                        <i class="fa-solid fa-right-left text-[#00d084]"></i>
                        <span class="text-[10px] font-bold">Trade</span>
                    </button>
                    <button id="main-verify-btn" onclick="startVerification()" class="bg-[#00d084] p-4 rounded-2xl flex flex-col items-center gap-2 text-black">
                        <i class="fa-solid fa-shield"></i>
                        <span class="text-[10px] font-bold">Verify</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-[#161a1e] border border-gray-800 rounded-3xl overflow-hidden">
            <div class="p-6 border-b border-gray-800"><h3 class="font-bold">Live Markets</h3></div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <tbody id="asset-table-body" class="divide-y divide-gray-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="deposit-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="bg-[#161a1e] border border-gray-800 w-full max-w-md rounded-3xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Deposit</h2>
                <button onclick="closeModal('deposit-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <button onclick="document.getElementById('usdt-addr').classList.toggle('hidden')" class="w-full bg-[#1e2329] p-4 rounded-2xl flex items-center gap-4">
                    <i class="fa-solid fa-t text-green-500"></i>
                    <div class="text-left"><p class="font-bold text-sm">USDT (TRC20)</p></div>
                </button>
                <div id="usdt-addr" class="hidden p-3 bg-black rounded-xl text-center">
                    <p class="text-[10px] text-gray-500 font-mono break-all">TW9P39iABsifkwcD7RF4aLS2XiTR5EWyVG</p>
                </div>
                <a href="https://wa.me/message/6SMSB3JEQKBKC1" class="w-full bg-[#1e2329] p-4 rounded-2xl flex items-center gap-4">
                    <i class="fa-brands fa-whatsapp text-blue-500"></i>
                    <div class="text-left"><p class="font-bold text-sm">WhatsApp Support</p></div>
                </a>
            </div>
        </div>
    </div>

    <div id="verify-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="bg-[#161a1e] border border-gray-800 w-full max-w-md rounded-3xl p-6 overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-bold mb-4">Identity Verification</h2>
            <form id="kyc-form" class="space-y-4">
                <input type="text" id="kyc-fname" placeholder="First Name" required class="w-full bg-[#0b0e11] p-3 rounded-xl border border-gray-800">
                <input type="text" id="kyc-lname" placeholder="Last Name" required class="w-full bg-[#0b0e11] p-3 rounded-xl border border-gray-800">
                <select id="kyc-type" class="w-full bg-[#0b0e11] p-3 rounded-xl border border-gray-800">
                    <option value="ID">National ID</option>
                    <option value="Passport">Passport</option>
                </select>
                <div class="text-xs text-gray-500 uppercase">Front Image</div>
                <input type="file" id="id-front" required class="text-xs">
                <div class="text-xs text-gray-500 uppercase">Back Image</div>
                <input type="file" id="id-back" required class="text-xs">
                <button type="submit" id="submit-kyc-btn" class="w-full bg-[#00d084] text-black font-bold py-3 rounded-xl">Submit</button>
                <button type="button" onclick="closeModal('verify-modal')" class="w-full text-gray-500 text-sm">Cancel</button>
            </form>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
