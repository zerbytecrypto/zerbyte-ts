<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerbyte | Swap</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0e11] text-white p-6">
    <div class="max-w-md mx-auto bg-[#161a1e] p-6 rounded-3xl border border-gray-800 mt-10">
        <h2 class="text-xl font-bold mb-6">Swap Assets</h2>
        <div class="space-y-4">
            <div class="bg-black p-4 rounded-xl">
                <label class="text-xs text-gray-500">From USDT</label>
                <input type="number" id="swap-amt" placeholder="0.00" class="bg-transparent w-full text-2xl outline-none font-bold mt-1">
            </div>
            <div class="bg-black p-4 rounded-xl">
                <label class="text-xs text-gray-500">To BTC (Estimated)</label>
                <input type="text" id="swap-res" readonly placeholder="0.000000" class="bg-transparent w-full text-2xl outline-none font-bold mt-1">
            </div>
            <button onclick="alert('Balance insufficient for network fees.')" class="w-full bg-[#00d084] text-black font-bold py-4 rounded-2xl">Confirm Swap</button>
            <button onclick="window.location.href='dashboard.html'" class="w-full text-gray-500 text-sm">Back to Dashboard</button>
        </div>
    </div>
    <script>
        document.getElementById('swap-amt').oninput = function() {
            document.getElementById('swap-res').value = (this.value * 0.000010).toFixed(6);
        }
    </script>
</body>
</html>
