<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Zerbyte | Transaction History</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0b0e11;
        }

        .transaction-card {
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .transaction-card:active {
            transform: scale(0.99);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>


<body class="bg-[#0b0e11] text-white font-sans min-h-screen">


    <!-- ========================================================= -->
    <!-- HEADER -->
    <!-- ========================================================= -->

    <nav
        class="sticky top-0 z-50 bg-[#0b0e11]/95 backdrop-blur-md border-b border-gray-800"
    >

        <div class="max-w-3xl mx-auto px-4 py-4">

            <div class="flex items-center justify-between">

                <!-- Back -->
                <button
                    onclick="goBack()"
                    class="w-10 h-10 rounded-xl bg-[#161a1e] border border-gray-800 flex items-center justify-center text-gray-300"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                </button>


                <!-- Title -->
                <div class="text-center">

                    <h1 class="font-bold text-lg">
                        Transaction History
                    </h1>

                    <p
                        id="user-email"
                        class="text-[10px] text-gray-500 mt-0.5"
                    >
                        Loading...
                    </p>

                </div>


                <!-- Refresh -->
                <button
                    id="refresh-btn"
                    onclick="loadHistory()"
                    class="w-10 h-10 rounded-xl bg-[#161a1e] border border-gray-800 flex items-center justify-center text-gray-300"
                >
                    <i class="fa-solid fa-rotate"></i>
                </button>

            </div>

        </div>

    </nav>



    <!-- ========================================================= -->
    <!-- MAIN -->
    <!-- ========================================================= -->

    <main class="max-w-3xl mx-auto px-4 py-5 pb-24">


        <!-- ===================================================== -->
        <!-- BALANCE SUMMARY -->
        <!-- ===================================================== -->

        <div
            class="bg-[#161a1e] border border-gray-800 rounded-3xl p-5 mb-5"
        >

            <div class="flex items-center justify-between">

                <div>

                    <p class="text-xs text-gray-500 uppercase tracking-wider">
                        Current Balance
                    </p>

                    <h2
                        id="current-balance"
                        class="text-3xl font-bold mt-1 tabular-nums"
                    >
                        ARS 0.00
                    </h2>

                </div>


                <div
                    class="w-12 h-12 rounded-2xl bg-[#00d084]/10 flex items-center justify-center"
                >

                    <i
                        class="fa-solid fa-wallet text-[#00d084] text-xl"
                    ></i>

                </div>

            </div>

        </div>



        <!-- ===================================================== -->
        <!-- FILTERS -->
        <!-- ===================================================== -->

        <div class="mb-5">

            <div
                class="flex gap-2 overflow-x-auto scrollbar-hide pb-1"
            >

                <button
                    onclick="setFilter('all')"
                    id="filter-all"
                    class="filter-btn whitespace-nowrap px-4 py-2.5 rounded-xl text-xs font-bold bg-[#00d084] text-black"
                >
                    All
                </button>

                <button
                    onclick="setFilter('deposit')"
                    id="filter-deposit"
                    class="filter-btn whitespace-nowrap px-4 py-2.5 rounded-xl text-xs font-bold bg-[#161a1e] text-gray-400 border border-gray-800"
                >
                    Deposits
                </button>

                <button
                    onclick="setFilter('withdrawal')"
                    id="filter-withdrawal"
                    class="filter-btn whitespace-nowrap px-4 py-2.5 rounded-xl text-xs font-bold bg-[#161a1e] text-gray-400 border border-gray-800"
                >
                    Withdrawals
                </button>

                <button
                    onclick="setFilter('refund')"
                    id="filter-refund"
                    class="filter-btn whitespace-nowrap px-4 py-2.5 rounded-xl text-xs font-bold bg-[#161a1e] text-gray-400 border border-gray-800"
                >
                    Refunds
                </button>

            </div>

        </div>



        <!-- ===================================================== -->
        <!-- LOADING -->
        <!-- ===================================================== -->

        <div
            id="loading-section"
            class="py-16 text-center"
        >

            <div
                class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-[#161a1e] border border-gray-800 mb-4"
            >

                <i
                    class="fa-solid fa-spinner fa-spin text-[#00d084]"
                ></i>

            </div>

            <p class="text-sm text-gray-500">
                Loading transaction history...
            </p>

        </div>



        <!-- ===================================================== -->
        <!-- ERROR -->
        <!-- ===================================================== -->

        <div
            id="error-section"
            class="hidden py-12 text-center"
        >

            <div
                class="w-14 h-14 mx-auto rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center mb-4"
            >

                <i
                    class="fa-solid fa-triangle-exclamation text-red-400 text-xl"
                ></i>

            </div>

            <h3 class="font-bold mb-2">
                Unable to load history
            </h3>

            <p
                id="error-message"
                class="text-sm text-gray-500 mb-5"
            >
                Please try again.
            </p>

            <button
                onclick="loadHistory()"
                class="px-5 py-3 rounded-xl bg-[#00d084] text-black text-sm font-bold"
            >
                Try Again
            </button>

        </div>



        <!-- ===================================================== -->
        <!-- EMPTY -->
        <!-- ===================================================== -->

        <div
            id="empty-section"
            class="hidden py-16 text-center"
        >

            <div
                class="w-16 h-16 mx-auto rounded-3xl bg-[#161a1e] border border-gray-800 flex items-center justify-center mb-5"
            >

                <i
                    class="fa-solid fa-clock-rotate-left text-gray-500 text-2xl"
                ></i>

            </div>

            <h3 class="font-bold text-lg mb-2">
                No transactions yet
            </h3>

            <p class="text-sm text-gray-500 max-w-xs mx-auto">
                Your deposits, withdrawals and refunds will appear here.
            </p>

        </div>



        <!-- ===================================================== -->
        <!-- TRANSACTION LIST -->
        <!-- ===================================================== -->

        <div
            id="transaction-list"
            class="space-y-3"
        ></div>


    </main>



    <!-- ========================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================================= -->

    <script>

        // =========================================================
        // SUPABASE
        // =========================================================

        const supabaseUrl =
            'https://odvjvyctqaidcexrqmrc.supabase.co';

        const supabaseAnonKey =
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJvZGp2amVjdHFhaWRjZXhxcXJtYyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzY3OTE1OTgxLCJleHAiOjIwODM0OTE5ODF9.anicfODTH70oAhpniUMI_9KWQL7hie6i9cZHzUJa6hU';


        const sb = supabase.createClient(
            supabaseUrl,
            supabaseAnonKey
        );


        // =========================================================
        // VARIABLES
        // =========================================================

        let currentUser = null;

        let allTransactions = [];

        let activeFilter = 'all';



        // =========================================================
        // ARS FORMAT
        // =========================================================

        function formatARS(amount) {

            return new Intl.NumberFormat('es-AR', {

                style: 'currency',

                currency: 'ARS',

                currencyDisplay: 'code',

                minimumFractionDigits: 2,

                maximumFractionDigits: 2

            }).format(Number(amount) || 0);

        }



        // =========================================================
        // HTML ESCAPE
        // =========================================================

        function escapeHtml(value) {

            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');

        }



        // =========================================================
        // INITIALIZE
        // =========================================================

        async function initializePage() {

            try {

                const {
                    data: {
                        session
                    },
                    error
                } = await sb.auth.getSession();


                if (error) {

                    throw error;

                }


                if (!session || !session.user) {

                    window.location.href = 'auth.html';

                    return;

                }


                currentUser = session.user;


                document.getElementById(
                    'user-email'
                ).textContent =
                    currentUser.email || '';


                await loadHistory();


            } catch (error) {

                console.error(
                    'History initialization error:',
                    error
                );


                showError(
                    'Your session could not be loaded. Please log in again.'
                );

            }

        }



        // =========================================================
        // LOAD HISTORY
        // =========================================================

        async function loadHistory() {

            const loading =
                document.getElementById(
                    'loading-section'
                );

            const errorSection =
                document.getElementById(
                    'error-section'
                );

            const emptySection =
                document.getElementById(
                    'empty-section'
                );

            const list =
                document.getElementById(
                    'transaction-list'
                );

            const refreshButton =
                document.getElementById(
                    'refresh-btn'
                );


            loading.classList.remove('hidden');

            errorSection.classList.add('hidden');

            emptySection.classList.add('hidden');

            list.innerHTML = '';


            refreshButton.innerHTML =
                '<i class="fa-solid fa-spinner fa-spin"></i>';


            try {

                if (!currentUser) {

                    const {
                        data: {
                            session
                        }
                    } = await sb.auth.getSession();


                    if (
                        !session ||
                        !session.user
                    ) {

                        window.location.href =
                            'auth.html';

                        return;

                    }


                    currentUser =
                        session.user;

                }



                // =================================================
                // TRANSACTIONS
                // =================================================

                const {
                    data,
                    error
                } = await sb
                    .from('transactions')
                    .select(`
                        id,
                        user_id,
                        amount,
                        type,
                        status,
                        created_at,
                        details,
                        balance_before,
                        balance_after,
                        currency
                    `)
                    .eq(
                        'user_id',
                        currentUser.id
                    )
                    .order(
                        'created_at',
                        {
                            ascending: false
                        }
                    );


                if (error) {

                    throw error;

                }


                allTransactions =
                    data || [];



                // =================================================
                // CURRENT BALANCE
                // =================================================

                await loadCurrentBalance();



                loading.classList.add(
                    'hidden'
                );


                renderTransactions();


            } catch (error) {

                console.error(
                    'Transaction history error:',
                    error
                );


                loading.classList.add(
                    'hidden'
                );


                showError(
                    'Unable to load your transaction history.'
                );


            } finally {

                refreshButton.innerHTML =
                    '<i class="fa-solid fa-rotate"></i>';

            }

        }



        // =========================================================
        // CURRENT BALANCE
        // =========================================================

        async function loadCurrentBalance() {

            const {
                data,
                error
            } = await sb
                .from('profiles')
                .select('balance')
                .eq(
                    'id',
                    currentUser.id
                )
                .single();


            if (error) {

                console.error(
                    'Balance loading error:',
                    error
                );

                return;

            }


            const balance =
                Number(
                    data?.balance || 0
                );


            document.getElementById(
                'current-balance'
            ).textContent =
                formatARS(balance);

        }



        // =========================================================
        // RENDER TRANSACTIONS
        // =========================================================

        function renderTransactions() {

            const list =
                document.getElementById(
                    'transaction-list'
                );

            const empty =
                document.getElementById(
                    'empty-section'
                );


            list.innerHTML = '';


            let transactions =
                allTransactions;


            if (activeFilter !== 'all') {

                transactions =
                    allTransactions.filter(
                        transaction =>
                            transaction.type ===
                            activeFilter
                    );

            }


            if (!transactions.length) {

                empty.classList.remove(
                    'hidden'
                );

                return;

            }


            empty.classList.add(
                'hidden'
            );


            transactions.forEach(
                transaction => {

                    list.insertAdjacentHTML(
                        'beforeend',
                        createTransactionCard(
                            transaction
                        )
                    );

                }
            );

        }



        // =========================================================
        // TRANSACTION CARD
        // =========================================================

        function createTransactionCard(
            transaction
        ) {

            const type =
                transaction.type ||
                'transaction';


            const amount =
                Number(
                    transaction.amount || 0
                );


            const before =
                transaction.balance_before !==
                null &&
                transaction.balance_before !==
                undefined
                    ? Number(
                        transaction.balance_before
                    )
                    : null;


            const after =
                transaction.balance_after !==
                null &&
                transaction.balance_after !==
                undefined
                    ? Number(
                        transaction.balance_after
                    )
                    : null;


            const status =
                String(
                    transaction.status ||
                    'pending'
                ).toLowerCase();


            const typeInfo =
                getTypeInfo(type);


            const statusInfo =
                getStatusInfo(status);


            const date =
                formatDate(
                    transaction.created_at
                );


            const amountPrefix =
                type === 'withdrawal'
                    ? '-'
                    : '+';


            const amountClass =
                type === 'withdrawal'
                    ? 'text-orange-400'
                    : 'text-[#00d084]';


            const balanceChange =
                before !== null &&
                after !== null
                    ? after - before
                    : null;


            const balanceChangeText =
                balanceChange !== null
                    ? (
                        balanceChange >= 0
                            ? '+'
                            : ''
                    ) +
                    formatARS(
                        balanceChange
                    )
                    : '—';


            return `

                <div
                    class="transaction-card bg-[#161a1e] border border-gray-800 rounded-2xl p-4"
                >

                    <!-- TOP -->

                    <div class="flex items-start justify-between gap-3">

                        <div class="flex items-center gap-3">

                            <div
                                class="w-11 h-11 rounded-2xl ${typeInfo.bg} flex items-center justify-center"
                            >

                                <i
                                    class="${typeInfo.icon} ${typeInfo.color}"
                                ></i>

                            </div>


                            <div>

                                <p class="font-bold text-sm">
                                    ${typeInfo.label}
                                </p>

                                <p class="text-[11px] text-gray-500 mt-0.5">
                                    ${date}
                                </p>

                            </div>

                        </div>


                        <div class="text-right">

                            <p
                                class="font-bold text-sm ${amountClass}"
                            >
                                ${amountPrefix}${formatARS(amount)}
                            </p>

                            <span
                                class="inline-flex mt-1 px-2 py-1 rounded-full text-[9px] font-bold uppercase ${statusInfo.bg} ${statusInfo.color} border ${statusInfo.border}"
                            >
                                ${statusInfo.label}
                            </span>

                        </div>

                    </div>


                    <!-- DIVIDER -->

                    <div
                        class="border-t border-gray-800 my-4"
                    ></div>


                    <!-- BALANCE DETAILS -->

                    <div class="grid grid-cols-3 gap-2">

                        <div>

                            <p class="text-[9px] text-gray-600 uppercase tracking-wide">
                                Before
                            </p>

                            <p class="text-xs font-semibold text-gray-300 mt-1">
                                ${
                                    before !== null
                                        ? formatARS(before)
                                        : '—'
                                }
                            </p>

                        </div>


                        <div>

                            <p class="text-[9px] text-gray-600 uppercase tracking-wide">
                                Change
                            </p>

                            <p
                                class="text-xs font-semibold mt-1 ${
                                    balanceChange !== null &&
                                    balanceChange < 0
                                        ? 'text-orange-400'
                                        : 'text-[#00d084]'
                                }"
                            >
                                ${balanceChangeText}
                            </p>

                        </div>


                        <div class="text-right">

                            <p class="text-[9px] text-gray-600 uppercase tracking-wide">
                                After
                            </p>

                            <p class="text-xs font-semibold text-white mt-1">
                                ${
                                    after !== null
                                        ? formatARS(after)
                                        : '—'
                                }
                            </p>

                        </div>

                    </div>


                    ${
                        transaction.details
                            ? createDetailsSection(
                                transaction.details
                            )
                            : ''
                    }

                </div>

            `;

        }



        // =========================================================
        // TRANSACTION TYPE
        // =========================================================

        function getTypeInfo(type) {

            switch (type) {

                case 'deposit':

                    return {

                        label: 'Deposit',

                        icon:
                            'fa-solid fa-arrow-down',

                        color:
                            'text-[#00d084]',

                        bg:
                            'bg-[#00d084]/10'

                    };


                case 'withdrawal':

                    return {

                        label: 'Withdrawal',

                        icon:
                            'fa-solid fa-arrow-up',

                        color:
                            'text-orange-400',

                        bg:
                            'bg-orange-400/10'

                    };


                case 'refund':

                    return {

                        label: 'Refund',

                        icon:
                            'fa-solid fa-rotate-left',

                        color:
                            'text-blue-400',

                        bg:
                            'bg-blue-400/10'

                    };


                default:

                    return {

                        label:
                            capitalize(type),

                        icon:
                            'fa-solid fa-money-bill-transfer',

                        color:
                            'text-gray-400',

                        bg:
                            'bg-gray-400/10'

                    };

            }

        }



        // =========================================================
        // STATUS
        // =========================================================

        function getStatusInfo(status) {

            switch (status) {

                case 'completed':

                    return {

                        label: 'Completed',

                        color:
                            'text-[#00d084]',

                        bg:
                            'bg-[#00d084]/10',

                        border:
                            'border-[#00d084]/20'

                    };


                case 'pending':

                    return {

                        label: 'Pending',

                        color:
                            'text-yellow-400',

                        bg:
                            'bg-yellow-400/10',

                        border:
                            'border-yellow-400/20'

                    };


                case 'rejected':

                    return {

                        label: 'Rejected',

                        color:
                            'text-red-400',

                        bg:
                            'bg-red-400/10',

                        border:
                            'border-red-400/20'

                    };


                default:

                    return {

                        label:
                            capitalize(status),

                        color:
                            'text-gray-400',

                        bg:
                            'bg-gray-400/10',

                        border:
                            'border-gray-400/20'

                    };

            }

        }



        // =========================================================
        // DETAILS
        // =========================================================

        function createDetailsSection(
            details
        ) {

            let text = '';


            try {

                if (
                    typeof details ===
                    'object'
                ) {

                    const values = [];


                    if (
                        details.bank_name
                    ) {

                        values.push(
                            `Bank: ${escapeHtml(
                                details.bank_name
                            )}`
                        );

                    }


                    if (
                        details.account_name
                    ) {

                        values.push(
                            `Account: ${escapeHtml(
                                details.account_name
                            )}`
                        );

                    }


                    if (
                        details.cbu
                    ) {

                        values.push(
                            `CBU: ${escapeHtml(
                                details.cbu
                            )}`
                        );

                    }


                    if (
                        details.reason
                    ) {

                        values.push(
                            `Reason: ${escapeHtml(
                                details.reason
                            )}`
                        );

                    }


                    if (values.length) {

                        text =
                            values.join(
                                ' • '
                            );

                    }

                }

            } catch (error) {

                console.error(
                    'Details parsing error:',
                    error
                );

            }


            if (!text) {

                return '';

            }


            return `

                <div
                    class="mt-4 pt-3 border-t border-gray-800"
                >

                    <p class="text-[10px] text-gray-500 leading-relaxed">
                        ${text}
                    </p>

                </div>

            `;

        }



        // =========================================================
        // DATE
        // =========================================================

        function formatDate(
            dateString
        ) {

            if (!dateString) {

                return 'Date unavailable';

            }


            const date =
                new Date(
                    dateString
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return 'Date unavailable';

            }


            return new Intl.DateTimeFormat(
                undefined,
                {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }
            ).format(date);

        }



        // =========================================================
        // FILTER
        // =========================================================

        function setFilter(
            filter
        ) {

            activeFilter =
                filter;


            document
                .querySelectorAll(
                    '.filter-btn'
                )
                .forEach(
                    button => {

                        button.classList.remove(
                            'bg-[#00d084]',
                            'text-black'
                        );

                        button.classList.add(
                            'bg-[#161a1e]',
                            'text-gray-400',
                            'border',
                            'border-gray-800'
                        );

                    }
                );


            const activeButton =
                document.getElementById(
                    `filter-${filter}`
                );


            if (activeButton) {

                activeButton.classList.remove(
                    'bg-[#161a1e]',
                    'text-gray-400',
                    'border',
                    'border-gray-800'
                );

                activeButton.classList.add(
                    'bg-[#00d084]',
                    'text-black'
                );

            }


            renderTransactions();

        }



        // =========================================================
        // ERROR
        // =========================================================

        function showError(
            message
        ) {

            document
                .getElementById(
                    'loading-section'
                )
                .classList.add(
                    'hidden'
                );


            document
                .getElementById(
                    'empty-section'
                )
                .classList.add(
                    'hidden'
                );


            document
                .getElementById(
                    'error-section'
                )
                .classList.remove(
                    'hidden'
                );


            document
                .getElementById(
                    'error-message'
                )
                .textContent =
                message;

        }



        // =========================================================
        // BACK
        // =========================================================

        function goBack() {

            if (
                document.referrer &&
                document.referrer
                    .includes(
                        window.location.hostname
                    )
            ) {

                window.history.back();

            } else {

                window.location.href =
                    'dashboard.html';

            }

        }



        // =========================================================
        // CAPITALIZE
        // =========================================================

        function capitalize(
            value
        ) {

            if (!value) {

                return '';

            }


            return (
                value.charAt(0)
                    .toUpperCase() +
                value.slice(1)
            );

        }



        // =========================================================
        // AUTH STATE
        // =========================================================

        sb.auth.onAuthStateChange(
            (event, session) => {

                if (
                    event ===
                    'SIGNED_OUT'
                ) {

                    window.location.href =
                        'auth.html';

                }

            }
        );



        // =========================================================
        // START
        // =========================================================

        initializePage();

    </script>

</body>
</html>
